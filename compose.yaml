# Ambiente local: imita a AWS (o nginx faz o papel do ALB: "/" -> front, "/api/*" -> back)
#
#   docker compose up --build                       -> http://localhost:8080
#   docker compose up --build --scale backend=2     -> 2 réplicas do back (testa o balanceamento)

services:
  redis:
    image: redis:7
    command: redis-server --appendonly yes   # grava em disco, como na EC2
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"   # só para você usar o redis-cli local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      # na AWS estes valores vêm da EC2; localmente são fixos
      HOST_IP: local
      HOST_AZ: local
      HOST_INSTANCE_ID: local-compose
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    # sem "ports" nem "container_name" de propósito: assim dá para usar --scale backend=N

  frontend:
    build: ./frontend
    volumes:
      # mesma imagem da AWS; só a config do nginx muda, para ele encaminhar /api ao back
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
